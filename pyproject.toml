[project]
name = "fs-bot"
version = "0.1.0"
description = "港交所年报/中报爬虫"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "futu-api>=10.7",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright[nodejs]",
    "pytest",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.22",
]
