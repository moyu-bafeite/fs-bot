[project]
name = "fs-bot"
version = "0.1.0"
description = "港交所年报/中报爬虫"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.0",
    "beautifulsoup4>=4.12",
    "cryptography<44",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright[nodejs]",
    "pytest",
]
