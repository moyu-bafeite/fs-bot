[project]
name = "hk-bot"
version = "0.1.0"
description = "港股数据工具链"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pyrate-limiter>=4.4.0",
    "opencc-python-reimplemented>=0.1.7",
    "xlrd>=2.0.2",
    "tigeropen>=3.7",
    "akshare>=1.14",
    "pdfplumber>=0.11.10",
    "openai>=3.3.1",
    "telegramify-markdown>=1.2.0",
    "python-telegram-bot>=22.8",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright[nodejs]",
    "pytest",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.22",
]
